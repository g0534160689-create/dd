name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DaatAharon.sln
      - name: Build
        run: dotnet build DaatAharon.sln -c Release --no-restore
      - name: Publish self-contained
        run: dotnet publish src/DaatAharon.Desktop/DaatAharon.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
      - name: Download offline WebView2 Runtime installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force webview2 | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/WebView2EvergreenStandaloneInstallerX64" -OutFile "webview2/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=2.0.${{ github.run_number }}" installer/DaatAharon.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Package portable
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/DaatAharon-portable-win-x64.zip
      - name: Verify installer
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/installer/DaatAharon-Setup-win-x64.exe)) { throw "Installer was not created" }
          if ((Get-Item artifacts/installer/DaatAharon-Setup-win-x64.exe).Length -lt 1000000) { throw "Installer is unexpectedly small" }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaatAharon-Windows
          path: |
            artifacts/installer/DaatAharon-Setup-win-x64.exe
            artifacts/DaatAharon-portable-win-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}
          name: דעת אהרן ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          files: |
            artifacts/installer/DaatAharon-Setup-win-x64.exe
            artifacts/DaatAharon-portable-win-x64.zip
