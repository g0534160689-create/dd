name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DaatAharon.sln
      - name: Build
        run: dotnet build DaatAharon.sln -c Release --no-restore
      - name: Publish self-contained
        run: dotnet publish src/DaatAharon.Desktop/DaatAharon.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
      - name: Package portable
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/DaatAharon-portable-win-x64.zip
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaatAharon-Windows
          path: |
            artifacts/publish/
            artifacts/DaatAharon-portable-win-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: דעת אהרן ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          files: artifacts/DaatAharon-portable-win-x64.zip
